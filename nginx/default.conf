# nginx/default.conf
server {
    listen 80;
    server_name localhost;
    root /app/public;

    location / {
        # Intentar servir el archivo directamente, si no existe, enviarlo a index.php
        try_files $uri /index.php$is_args$args;
    }

    location ~ ^/index\.php(/|$) {
        # Conecta con el contenedor "backend" por el puerto interno 9000 de PHP-FPM
        fastcgi_pass backend:9000;
        fastcgi_split_path_info ^(.+\.php)(/.*)$;
        include fastcgi_params;

        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
        internal;
    }

    # Retornar 404 para cualquier otro archivo .php por seguridad
    location ~ \.php$ {
        return 404;
    }

    error_log /var/log/nginx/project_error.log;
    access_log /var/log/nginx/project_access.log;
}